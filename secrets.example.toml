# Copy to .secrets.toml and keep the real file local (it is Git-ignored).
# Option A: paste the raw Jetstream key here.
# API_KEY = "paste-your-raw-key-here"

# Option B (macOS): name a generic password saved in Keychain Access.
# The default item name is "Bluesky Jetstream API key"; set these only if needed.
# KEYCHAIN_ITEM = "Bluesky Jetstream API key"
# KEYCHAIN_ACCOUNT = "yourname.bsky.social"

# Optional live-test settings.
# ENDPOINT = "https://jetstream.us-east.bsky.network"
# STARTING_CURSOR = 0
